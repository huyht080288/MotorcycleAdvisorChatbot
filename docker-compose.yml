services:
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    env_file:
      - src/.env
    volumes:
      - ./src/DataRef:/app/src/DataRef
      - ./src/data/model:/app/src/data/model
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    ports:
      - "8081:80"
    depends_on:
      - backend
    restart: unless-stopped
